name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aronline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aronline_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aronline_test
      APP_URL: http://localhost:3000
      APP_ENV: test
      PAYMENTS_MODE: mock
      REQUIRE_VERIFIED_CORE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typová kontrola
        run: npm run typecheck
      - name: Jednotkové a integrační testy (výpočet, oprávnění, platby, export)
        run: npm test
      - name: Kontrolní seznam ověření je aktuální
        run: |
          npm run verification:checklist
          git diff --exit-code docs/verification-checklist.md
      - name: Build
        run: npm run build
      - name: E2E test celého průchodu
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aronline_test
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          npm start > server.log 2>&1 &
          npx --yes wait-on -t 60000 http://localhost:3000/api/health
          npx playwright test 2>&1 | tee e2e.log
      - name: Diagnostika při chybě
        if: failure()
        run: |
          # výstup jako anotace (čitelné i přes API bez stahování logů)
          enc() { tail -c 2500 "$1" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=E2E výstup::$(enc e2e.log)"
          echo "::error title=Log serveru::$(enc server.log)"
      - name: Výsledky E2E (snímky při chybě)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
