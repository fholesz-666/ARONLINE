name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aronline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aronline_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aronline_test
      APP_URL: http://localhost:3000
      APP_ENV: test
      PAYMENTS_MODE: mock
      REQUIRE_VERIFIED_CORE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typová kontrola
        run: npm run typecheck
      - name: Jednotkové a integrační testy (výpočet, oprávnění, platby, export)
        run: npm test
      - name: Kontrolní seznam ověření je aktuální
        run: |
          npm run verification:checklist
          git diff --exit-code docs/verification-checklist.md
      - name: Build
        run: npm run build
      - name: E2E test celého průchodu
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aronline_test
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          npx playwright install --with-deps chromium
          npm start > server.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/api/health
          npx playwright test
      - name: Log serveru při chybě
        if: failure()
        run: cat server.log || true
